name: CS Dashboard 자동 갱신

on:
  schedule:
    - cron: '*/30 * * * *'  # 30분마다 실행 (UTC)
  workflow_dispatch:  # 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: 채널톡 데이터 수집 (오늘 실시간 + 전일 closed)
        env:
          CHANNEL_ACCESS_KEY: ${{ secrets.CHANNEL_ACCESS_KEY }}
          CHANNEL_ACCESS_SECRET: ${{ secrets.CHANNEL_ACCESS_SECRET }}
        run: python collector.py

      - name: 데이터 가공
        run: python processor.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "📊 데이터 자동 갱신 $(date +'%Y-%m-%d %H:%M')" && git push)
